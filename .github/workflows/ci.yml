name: Validate and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-alpine
        env: {POSTGRES_USER: test, POSTGRES_PASSWORD: ci-test, POSTGRES_DB: test}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U test" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.27.1', cache: true}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: web/package-lock.json}
      - name: Dependency integrity and source formatting
        run: |
          test -s go.sum
          test -s fonts/source.lock
          go mod download
          gofmt -w cmd internal
          mkdir -p artifacts
          git diff -- cmd internal > artifacts/format.patch
      - name: Chinese font integrity
        run: |
          url=$(sed -n '1p' fonts/source.lock)
          sha=$(sed -n '2p' fonts/source.lock)
          curl --fail -L "$url" -o /tmp/NotoSansSC.ttf
          echo "$sha  /tmp/NotoSansSC.ttf" | sha256sum -c -
      - name: Go vet, race and PostgreSQL integration
        env:
          TEST_DATABASE_URL: postgres://test:ci-test@localhost:5432/test?sslmode=disable
          FONT_PATH: /tmp/NotoSansSC.ttf
        run: |
          go vet ./...
          set -o pipefail
          go test -race -count=1 -timeout 180s ./... | tee artifacts/go-tests.txt
      - name: Frontend checks
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run lint -- --deny-warnings
          npm run build
      - name: Check committed formatting
        run: git diff --exit-code -- cmd internal go.mod go.sum web/package-lock.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: source-checks, path: artifacts}
  containers:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: web/package-lock.json}
      - uses: docker/setup-buildx-action@v3
      - name: Native architecture build
        run: |
          docker buildx build --load --target runtime --platform linux/${{ matrix.arch }} -t trend-studio:ci .
          docker buildx build --load --target fixture --platform linux/${{ matrix.arch }} -t trend-fixture:ci .
      - name: Validate production Compose
        run: |
          cp deploy/.env.example deploy/.env
          cp deploy/collector/.env.example deploy/collector/.env
          docker compose --env-file deploy/.env -f deploy/compose.yml config --quiet
          docker compose --env-file deploy/collector/.env -f deploy/collector/compose.yml config --quiet
          ! grep -q 'build:' deploy/compose.yml
          ! grep -q 'build:' deploy/collector/compose.yml
      - name: Start real API, worker and database
        run: |
          docker compose -f tests/compose.yml up -d
          for n in $(seq 1 90); do
            if curl --fail -s http://localhost:8080/health/ready; then exit 0; fi
            sleep 2
          done
          docker compose -f tests/compose.yml logs
          exit 1
      - name: Browser integration and UI screenshots
        working-directory: web
        env: {CI: 'true'}
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Save exactly the tested image
        run: |
          mkdir -p artifacts
          docker image inspect trend-studio:ci > artifacts/image-inspect.json
          docker save trend-studio:ci | zstd -T0 -o artifacts/image-${{ matrix.arch }}.tar.zst
          sha256sum artifacts/image-${{ matrix.arch }}.tar.zst > artifacts/archive-sha256.txt
      - name: Runtime diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          docker compose -f tests/compose.yml logs --no-color > artifacts/runtime.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.arch }}
          path: |
            artifacts
            web/test-results
            web/playwright-report
      - name: Cleanup disposable CI data
        if: always()
        run: docker compose -f tests/compose.yml down -v
  publish:
    needs: [checks, containers]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: 'evidence-*', path: artifacts}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish previously tested image archives
        env: {SHA: '${{ github.sha }}'}
        run: |
          image=ghcr.io/sakuralaaa/trend-studio
          for arch in amd64 arm64; do
            archive=$(find artifacts/evidence-$arch -name "image-$arch.tar.zst")
            zstd -dc "$archive" | docker load
            docker tag trend-studio:ci "$image:sha-$SHA-$arch"
            docker push "$image:sha-$SHA-$arch"
          done
          docker buildx imagetools create -t "$image:sha-$SHA" "$image:sha-$SHA-amd64" "$image:sha-$SHA-arm64"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            docker buildx imagetools create -t "$image:$GITHUB_REF_NAME" "$image:sha-$SHA"
          fi
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            current=$(git ls-remote origin refs/heads/main | cut -f1)
            if [[ "$current" == "$SHA" ]]; then docker buildx imagetools create -t "$image:latest" "$image:sha-$SHA"; fi
          fi
          docker buildx imagetools inspect "$image:sha-$SHA" | tee artifacts/published-manifest.txt
          for arch in amd64 arm64; do docker pull --platform "linux/$arch" "$image:sha-$SHA"; done
          cat artifacts/published-manifest.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: {name: published-manifest, path: artifacts/published-manifest.txt}
