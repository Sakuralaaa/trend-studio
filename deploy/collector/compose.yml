# Fixed upstream v5.1.3, separate database and secrets. No host builds.
name: trend-collector
x-collector: &collector
  image: evil0ctal/douyin_tiktok_download_api:5.1.3
  env_file: .env
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  volumes: [collector-backups:/var/lib/dtk/backups]
services:
  postgres:
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_USER: dtk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      POSTGRES_DB: dtk
    volumes: [collector-db:/home/postgres/pgdata/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U dtk -d dtk"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:8.2.1-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Required}
    command: ["sh","-c","exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --maxmemory 320mb --maxmemory-policy volatile-lru"]
    volumes: [collector-redis:/data]
    healthcheck:
      test: ["CMD-SHELL","REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *collector
    command: ["migrate"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
  api:
    <<: *collector
    command: ["api"]
    environment: {DTK_BIND_HOST: '0.0.0.0', DTK_BIND_PORT: '8000', DTK_CONSOLE_DIR: /app/web/dist, DTK_BACKUP_DIR: /var/lib/dtk/backups}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    <<: *collector
    command: ["worker"]
    depends_on:
      api: {condition: service_healthy}
    stop_grace_period: 45s
volumes:
  collector-db:
  collector-redis:
  collector-backups:
