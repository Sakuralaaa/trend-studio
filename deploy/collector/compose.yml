# Separate collector stack; fixed upstream release, never builds on the host.
name: trend-collector
x-collector: &collector
  image: evil0ctal/douyin_tiktok_download_api:5.1.3
  env_file: .env
  restart: unless-stopped
services:
  timescaledb:
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_USER: collector
      POSTGRES_PASSWORD: ${COLLECTOR_DB_PASSWORD:?Required}
      POSTGRES_DB: collector
    volumes: [collector-db:/home/postgres/pgdata/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collector -d collector"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server","--requirepass","${COLLECTOR_REDIS_PASSWORD:?Required}"]
    volumes: [collector-redis:/data]
    healthcheck:
      test: ["CMD-SHELL","redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${COLLECTOR_REDIS_PASSWORD}
    restart: unless-stopped
  migrate:
    <<: *collector
    command: ["alembic","upgrade","head"]
    depends_on:
      timescaledb: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: "no"
  api:
    <<: *collector
    command: ["uvicorn","app.main:app","--host","0.0.0.0","--port","8000"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  worker:
    <<: *collector
    command: ["celery","-A","app.core.celery_app:celery_app","worker","--loglevel=info","--concurrency=2"]
    depends_on:
      migrate: {condition: service_completed_successfully}
volumes:
  collector-db:
  collector-redis:
